name: Android checks
on:
  push:
    branches: [main, dev, 'task/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: normal
            flags: ''
            audit: ''
          - variant: runtime
            flags: '-PopcRuntime=true'
            audit: '--runtime'
          - variant: advanced-runtime
            flags: '-PopcRuntime=true -PopcAdvancedInputs=true'
            audit: '--runtime --advanced-inputs'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew ${{ matrix.flags }} :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - run: python tools/package_debug.py ${{ matrix.audit }}
      - uses: actions/upload-artifact@v4
        with:
          name: OPlusKeyControl-${{ matrix.variant }}-debug
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-${{ matrix.variant }}
          path: |
            domain/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
